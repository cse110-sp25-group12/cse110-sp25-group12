[build]
  base = "."
  publish = "source"
# Redirect direct access to source paths to clean URLs
[[redirects]]
  from = "/source/pages/dashboard.html"
  to = "/dashboard"
  status = 301

[[redirects]]
  from = "/source/pages/applications.html"
  to = "/applications"
  status = 301

[[redirects]]
  from = "/source/pages/add_application.html"
  to = "/add-application"
  status = 301
  
[[redirects]]
  from = "/"
  to = "/pages/dashboard.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/pages/dashboard.html"
  status = 200

[[redirects]]
  from = "/applications"
  to = "/pages/applications.html"
  status = 200

[[redirects]]
  from = "/add-application"
  to = "/pages/add_application.html"
  status = 200

# Handle SPA routing - fallback for any unmatched routes
[[redirects]]
  from = "/*"
  to = "/pages/dashboard.html"
  status = 200 
