<!DOCTYPE html>
<html lang="en" data-theme="light" data-sidebar-collapsed="false"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/colors.css"> 
    <link rel="stylesheet" href="/styles/style.css"> 
</head>
<body class="app-layout"> 
    <app-sidebar></app-sidebar> <!-- Correctly use the app-sidebar component -->

    <main class="main-content-page">
        <header class="main-header">
            <h1>Job Application Dashboard</h1>
        </header>
        
        <div class="content-grid">
            <article class="content-card">
                <h2 class="content-card-title">Total Applications</h2>
                <div class="content-card-stat">...</div>
                <div class="content-card-details"><p>+5 this week</p></div>
            </article>
            <article class="content-card">
                <h2 class="content-card-title">Interviews Scheduled</h2>
                <div class="content-card-stat">...</div>
                <div class="content-card-details"><p>2 upcoming</p></div>
            </article>
            <article class="content-card">
                <h2 class="content-card-title">Active Processes</h2>
                <div class="content-card-stat">...</div>
                <div class="content-card-details"><p>Awaiting feedback for 8</p></div>
            </article>
            <article class="content-card">
                <h2 class="content-card-title">Offers Received</h2>
                <div class="content-card-stat">...</div>
                <div class="content-card-details"><p>1 new offer!</p></div>
            </article>

            <article class="content-card">
                <h2 class="content-card-title">Applications Over Time</h2>
                <div class="chart-container">
                    <canvas id="applicationsChart"></canvas> </div>
            </article>
            <article class="content-card">
                <h2 class="content-card-title">Application Status Breakdown</h2>
                <div class="chart-container">
                    <canvas id="statusChart"></canvas> </div>
            </article>

            <article class="content-card">
                <h2 class="content-card-title">Reset Dashboard</h2>
                <div style="text-align: right;">
                <button id="resetDataBtn">Clear All Application Data</button>
                </div>
            </article>
        </div>
    </main>
    
    <script src="/components/sidebar/sidebar.js" defer></script> 
    <script src="/components/material.js" defer></script> 
    <script src="/styles/template.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/dashboard.js" defer></script>
</body>
</html>
