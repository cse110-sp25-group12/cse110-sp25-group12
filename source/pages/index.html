<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Tracker</title>

  <!-- Styles -->
  <link rel="stylesheet" href="../styles/style.css">

  <!-- Material Symbols (All icons enabled) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
  <style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;
    }
  </style>
</head>
<body>

<article class="job-tracker-module">
  <!-- Filter Icon Button -->
  <button id="filter-toggle-btn" class="filter-icon-btn" title="Filter">
    <span class="material-symbols-outlined">filter_list</span>
  </button>

  <!-- Sort Controls -->
  <div id="sort-controls">
    <label for="sort-select">
      <span class="material-symbols-outlined">sort_by_alpha</span> Sort by:
    </label>
    <select id="sort-select">
      <option value="">-- Select --</option>
      <option value="company">Company Name (A–Z)</option>
      <option value="position">Position (A–Z)</option>
    </select>
  </div>

  <!-- Dropdown Menu -->
  <div id="filter-dropdown" class="dropdown hidden">
    <label><input type="checkbox" value="Remote"> Remote</label>
    <label><input type="checkbox" value="Full-Time"> Full-Time</label>
    <label><input type="checkbox" value="Internship"> Internship</label>
  </div>
</article>

  <main>
    <!-- Filtering Buttons will be inserted here -->
    <div id="filter-bar"></div>

    <!-- Cards will go here -->
  </main>

<!-- JavaScript Modules (placed at the end for best performance) -->
<script type="module" src="../js/app.js"></script>
<script type="module" src="../js/index.js"></script>

</body>
</html>
