<!DOCTYPE html>
<html lang="en" data-theme="light" data-sidebar-collapsed="false"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack - Applications</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/colors.css"> 
    <link rel="stylesheet" href="../components/card-model.css">
    <link rel="stylesheet" href="../styles/template.css"> 
    <link rel="stylesheet" href="../components/applications.css"> 
    <link rel="stylesheet" href="../components/job-card.css">
    <script src="../components/job-card.js" type="module"></script>
</head>
<body class="app-layout"> 
    <app-sidebar></app-sidebar>

    <main class="main-content-page"> 
        <header class="main-header">
            <h1>All Applications</h1>
        </header>
        
        <sorting-controls id="appSortingControls" class="applications-controls"></sorting-controls>
        
        <div id="applicationCardsContainer" class="content-grid">

            
        </div>
    </main>
    
    <div id="appDetailsModal" class="modal">
    <div class="modal-content">
        <button class="close-btn"><span class="material-symbols-outlined">&#xe5cd;</span></button>
        <button id="editApplicationBtn" class="close-btn"><span class="material-symbols-outlined">edit</span></button>
        <h2 id="modal-title"></h2>
        <p><strong>Company:</strong> <span id="modal-company"></span></p>
        <p><strong>Job Type:</strong> <span id="modal-type"></span></p>
        <p><strong>Location:</strong> <span id="modal-location"></span></p>
        <p><strong>Salary:</strong> <span id="modal-salary"></span></p>
        <p><strong>Date Applied:</strong> <span id="modal-date"></span></p>
        <p><strong>Status:</strong> <span id="modal-status"></span></p>
        <p><strong>Contact:</strong> <span id="modal-contact"></span></p>
        <p><strong>Phone:</strong> <span id="modal-phone"></span></p>
        <p><strong>Notes:</strong> <span id="modal-notes"></span></p>
        <div><strong>Important Dates:</strong>
        <ul id="modal-important-dates"></ul>
        </div>
    </div>
    </div>

    <script type="module" src="../components/job-card-component.js"></script> 
    <script type="module" src="../controllers/sorting-controls.js"></script> 
    <script src="../styles/template.js" defer></script>
    <script type="module" src="../js/applications-page.js"></script>
    <script src="../components/sidebar/sidebar.js" defer></script>
</body>
</html>
