<!DOCTYPE html>
<html lang="en" data-theme="light" data-sidebar-collapsed="false"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack - Applications</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/colors.css"> 
    <link rel="stylesheet" href="../components/card-model.css">
    <link rel="stylesheet" href="../styles/template.css"> 
    <link rel="stylesheet" href="../components/applications.css"> 
    <link rel="stylesheet" href="../components/job-card.css">
    <script src="../components/job-card.js" type="module"></script>
</head>
<body class="app-layout"> 
    <app-sidebar></app-sidebar>

    <main class="main-content-page"> 
        <header class="main-header">
            <button class="sidebar-toggle-button" id="sidebarToggle" aria-label="Toggle sidebar">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <h1>All Applications</h1>
        </header>
        
        <sorting-controls id="appSortingControls" class="applications-controls"></sorting-controls>
        
        <div id="applicationCardsContainer" class="content-grid">

            
        </div>
    </main>
    
    <div id="appDetailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <div class="modal-header-actions">
                    <button id="modalEditTopBtn" class="modal-action-btn icon-btn" aria-label="Edit Application">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                    <button class="close-btn icon-btn" aria-label="Close modal">&times;</button>
                </div>
            </div>
            <div class="modal-body">
                <p><strong>Company:</strong> <span id="modal-company" class="modal-display"></span><input type="text" id="edit-modal-company" class="modal-input"></p>
                <p><strong>Job Position:</strong> <span id="modal-jobPosition" class="modal-display"></span><input type="text" id="edit-modal-jobPosition" class="modal-input"></p>
                <p><strong>Job Type:</strong> <span id="modal-type" class="modal-display"></span>
                    <select id="edit-modal-type" class="modal-input">
                        <option value="Full-Time">Full-Time</option>
                        <option value="Part-Time">Part-Time</option>
                        <option value="Contract">Contract</option>
                        <option value="Internship">Internship</option>
                        <option value="Temporary">Temporary</option>
                    </select>
                </p>
                <p><strong>Salary:</strong> <span id="modal-salary" class="modal-display"></span><input type="number" id="edit-modal-salary" class="modal-input" placeholder="e.g., 75000"></p>
                <p><strong>Location:</strong> <span id="modal-location" class="modal-display"></span><input type="text" id="edit-modal-location" class="modal-input"></p>
                <p><strong>Date Applied:</strong> <span id="modal-date" class="modal-display"></span><input type="date" id="edit-modal-date" class="modal-input"></p>
                <p><strong>Status:</strong> <span id="modal-status" class="modal-display"></span>
                    <select id="edit-modal-status" class="modal-input">
                        <option value="Wishlist">Wishlist</option>
                        <option value="Applied">Applied</option>
                        <option value="Screening">Screening</option>
                        <option value="Interviewing">Interviewing</option>
                        <option value="Offer">Offer</option>
                        <option value="Rejected">Rejected</option>
                        <option value="Ghosted">Ghosted</option>
                        <option value="Withdrawn">Withdrawn</option>
                    </select>
                </p>
                <p><strong>Contact Name:</strong> <span id="modal-contactName" class="modal-display"></span><input type="text" id="edit-modal-contactName" class="modal-input"></p>
                <p><strong>Contact Email:</strong> <span id="modal-contactEmail" class="modal-display"></span><input type="email" id="edit-modal-contactEmail" class="modal-input"></p>
                <p><strong>Contact Phone:</strong> <span id="modal-contactPhone" class="modal-display"></span><input type="tel" id="edit-modal-contactPhone" class="modal-input"></p>
                
                <div><strong>Notes:</strong>
                    <span id="modal-notes" class="modal-display modal-notes-display"></span>
                    <textarea id="edit-modal-notes" class="modal-input modal-notes-input"></textarea>
                </div>
                <div><strong>Important Dates:</strong>
                    <ul id="modal-important-dates" class="modal-display"></ul>
                    <p class="modal-input"><em>Editing important dates directly here is not supported in this version.</em></p>
                </div>
            </div>
            <div class="modal-footer">
                <!-- Removed old #modalEditBtn from footer -->
                <button id="modalSaveBtn" class="modal-action-btn">Save</button>
                <button id="modalCancelBtn" class="modal-action-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="../components/job-card-component.js"></script> 
    <script type="module" src="../controllers/sorting-controls.js"></script> 
    <script src="../styles/template.js" defer></script>
    <script type="module" src="../js/applications-page.js"></script>
    <script src="../components/sidebar/sidebar.js" defer></script>
</body>
</html>
