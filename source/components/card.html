<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- your CSS (or external file) -->
  <link rel="stylesheet" href="job-card.css">
  <!-- Material Symbols font -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
  />
  <title>Job Card</title>
</head>
<body>

  <!-- as many cards as you like -->
    <a class="card">
        <button class="favorite" title="Bookmark">
        <span class="material-symbols-outlined">bookmark</span>
      </button>
      <img class="logo" src="https://example.com/logo.png" alt="Company Logo">
      
      <header>
        <h2 class="title">Senior UX Designer</h2>
        <h3 class="company">Acme Corp</h3>
      </header>
      <p class="position">Full-Time</p>
      <ul class="requirements"><li>5+ years experience</li><li>portfolio of design projects</li><li>strong communication skills</li></ul>
    </a>

  <script src="job-card.js"></script>
</body>
</html>
