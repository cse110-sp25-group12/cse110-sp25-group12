name: Generate JSDoc in docs/ for all branches

on:
  push:
    branches: [ "**" ]

  workflow_dispatch:

jobs:
  build-and-deploy-docs:
    name: Build and Commit JSDoc to Same Branch
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Generate JSDoc
        run: npm run docs
      
      - name: Commit generated docs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -f docs/
          git commit -m "Update JSDoc [auto]" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF#refs/heads/}

    