name: Generate and Push JSDoc to docs branch

on:
  push:
    branches:
      - main
      - cicd/initial-pipeline

  workflow_dispatch:

jobs:
  build-and-deploy-docs:
    name: Build and Push JSDoc to Separate Branch
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Generate JSDoc
        run: npm run docs
      
      - name: Deploy to docs branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: $${{ github.ref == 'refs/heads/main' && 'docs' || 'docs-cicd' }}
          force_orphan: true

    