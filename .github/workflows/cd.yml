# CD Pipeline - To streamline deployment

name: Deploy application to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Prepare Site for Pages
        run: |
          #staging folder
          mkdir dist
          #bring all source/pages/ html files into dist/
          rsync -av source/pages/ dist/
          #bring all submodules of source except pages into dist/
          rsync -av --exclude='pages' source/ dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./source/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
